tCut、Remotion、Electron、Agent/MCP 的智能视频编辑项目。</p>\n<h2>可沉淀资产</h2>\n<ul><li>时间线编辑</li><li>智能剪辑任务</li><li>Agent-native 视频编辑</li><li>Remotion 渲染</li><li>Electron 桌面端</li><li>MCP 与自动化工作流</li></ul>","automation-doubao-fastapi":"<h1>豆包视频 FastAPI + Playwright 自动化服务</h1>\n<ul><li>类型：自动化</li><li>分类：AI 视频 / 浏览器自动化 / 服务封装</li><li>状态：已验证（核心端到端链路）；部署方式仍按环境复核</li><li>难度：高级</li><li>分发：团队 / 私域</li><li>版本：0.1.0</li><li>更新时间：2026-08-21</li><li>维护人：念念团队</li><li>来源：内部项目 <code>E:/codex/niannianai/doubao-video-service</code></li></ul>\n<h2>一句话结论</h2>\n<p>把已获授权的豆包工作室视频生成操作封装成 FastAPI 服务：提交分镜提示词后，后台通过 CDP / Playwright 驱动本地工作室完成生成，并把下载到本地的 MP4 以任务状态和结果接口交付给上游系统。</p>\n<h2>解决什么问题</h2>\n<ul><li>上游画布或内部工具无法直接调用浏览器端视频生成流程。</li><li>人工在工作室中重复完成账号激活、模型/比例/时长设置、提示词提交和结果下载，难以批量化和稳定回收。</li><li>生成结束后需要让上游拿到可轮询的任务状态和 MP4 结果，而不是依赖人工找文件。</li></ul>\n<h2>适合谁</h2>\n<ul><li><strong>团队成员</strong>：已配置本地豆包工作室、拥有合法授权账号、需要将视频生成接入内部画布或任务系统的开发/运维人员。</li><li><strong>私域高级用户</strong>：在受控环境中需要参考实现、部署指导或一对一交付的用户。</li><li><strong>不适合公开用户</strong>：此服务依赖本地桌面工作室、已登录会话与受控浏览器环境，不能作为无账号、无授权的一键 SaaS 承诺。</li></ul>\n<h2>输入 → 处理 → 输出</h2>\n<pre><code>输入\n  分镜提示词 + 模型 + 时长（4–15 秒）+ 画面比例 + 提交模式\n\n处理\n  FastAPI 创建任务\n  → 自动尝试激活空闲账号\n  → 写入 worker manifest\n  → Node CDP Worker 向豆包工作室添加任务\n  → 工作室内的浏览器自动化分两次发送前置指令和分镜提示词\n  → 监控下载目录中的新 MP4\n\n输出\n  task_id + running/succeeded/failed 状态 + 本地 MP4 文件流</code></pre>\n<p>当前实际网关接口见 <code>app/main.py</code>：</p>\n<p>| 接口 | 作用 | 关键返回 |</p>\n<p>|---|---|---|</p>\n<p>| <code>GET /api/v1/capabilities</code> | 检查网关可用能力并尝试激活账号 | <code>ready</code>、模型、比例、时长、提交模式 |</p>\n<p>| <code>POST /api/v1/submit</code> | 创建视频生成任务 | <code>task_id</code>、<code>status</code>、账号激活结果 |</p>\n<p>| <code>GET /api/v1/status?task_id=</code> | 查询任务状态 | <code>running / succeeded / failed</code>、错误、结果摘要 |</p>\n<p>| <code>GET /api/v1/result?task_id=</code> | 在任务成功后返回 MP4 文件 | <code>video/mp4</code> 文件流 |</p>\n<blockquote>历史设计文档中曾使用 <code>/download</code> 作为结果接口；当前实现以 <code>/result</code> 为准。接入方必须以运行版本的 <code>/capabilities</code> 与源码接口为准，不可混用历史接口名。</blockquote>\n<h2>前置条件</h2>\n<ol><li>已安装并启动受控的豆包工作室，CDP 地址默认是本地 <code>127.0.0.1:9229</code>。</li><li>本地工作室存在可用、已授权的账号，且自动化有权使用该账号。</li><li>Worker 文件和 Node 运行时可用；实际路径由部署环境配置，不能将个人绝对路径复制到公开内容。</li><li>下载目录可写，且运行账户对目录具有读取权限。</li><li>仅提交拥有生成和使用权的提示词、图片、视频、音频与角色素材。</li><li>使用方接受平台条款、额度、模型可用性和页面改版带来的不稳定性。</li></ol>\n<h2>使用步骤 / 团队 SOP</h2>\n<h3>1. 启动依赖</h3>\n<ul><li>打开受控豆包工作室，确认至少一个授权账号可用。</li><li>确认 CDP 地址可访问，工作室主窗口和豆包 WebView 未被其他异常实例占用。</li><li>启动 FastAPI 网关；先调用 <code>/api/v1/capabilities</code> 确认网关返回 <code>ready: true</code>，并查看账号激活结果。</li></ul>\n<h3>2. 创建任务</h3>\n<p>向 <code>POST /api/v1/submit</code> 发送 JSON：</p>\n<pre><code>{\n  \"prompt\": \"填写已获授权的分镜提示词\",\n  \"model\": \"seedance-2.0-fast\",\n  \"duration\": 15,\n  \"aspect_ratio\": \"9:16\",\n  \"directMode\": \"ui\",\n  \"poll_seconds\": 900\n}</code></pre>\n<p>字段说明：</p>\n<ul><li><code>prompt</code>：必填，不能为空；比例与时长可由网关配置附带。</li><li><code>model</code>：当前默认 <code>seedance-2.0-fast</code>；实际支持项以 <code>capabilities.models</code> 为准。</li><li><code>duration</code>：4–15 秒。</li><li><code>aspect_ratio</code>：当前能力包括 <code>1:1</code>、<code>3:4</code>、<code>4:3</code>、<code>9:16</code>、<code>16:9</code>、<code>21:9</code>。</li><li><code>directMode</code>：<code>ui</code> 表示走工作室视频配置；<code>direct</code> 表示按提示词提交，仍需根据实际工作室版本验证。</li><li><code>poll_seconds</code>：Worker 最大等待秒数；不等同于平台生成承诺。</li></ul>\n<h3>3. 轮询和交付</h3>\n<ul><li>使用返回的 <code>task_id</code> 调用 <code>/api/v1/status?task_id=</code>。</li><li><code>running</code>：继续轮询；不要重复创建同一任务。</li><li><code>failed</code>：记录 <code>error</code> 和时间，先检查账号、CDP、工作室状态、模型和下载目录，再决定是否重试。</li><li><code>succeeded</code>：调用 <code>/api/v1/result?task_id=</code> 获取 MP4 文件流，并把文件注册到上游资产系统。</li></ul>\n<h2>已验证证据</h2>\n<p>以下证据来自当前工作区的真实集成记录，不代表所有账号、模型或线上环境均可复现：</p>\n<ul><li><code>E:/codex/niannianai/.workbuddy/memory/2026-08-21.md</code> 记录了 FastAPI <code>POST /api/v1/submit</code> → CDP Worker → 豆包工作室 → 自动下载 → <code>status=succeeded</code> 的端到端验证。</li><li>同一记录显示任务成功返回本地 <code>video_path</code>，并得到有效 MP4 文件；同时确认下载目录监控比依赖前端 UI 状态更可靠。</li><li>服务实现将长时间 Worker 放入 <code>asyncio.to_thread</code>，以避免 Worker 执行期间阻塞 <code>/status</code> 和 <code>/result</code>；见 <code>app/main.py</code> 的 <code>_run_worker</code>。</li></ul>\n<p>验收时必须重新执行以下最小检查：</p>\n<ol><li><code>/capabilities</code> 返回 <code>ready: true</code>，并记录账号激活结果。</li><li>提交一条低成本、已授权测试提示词，得到 <code>task_id</code>。</li><li>在合理等待期内轮询到 <code>succeeded</code> 或清晰的 <code>failed</code> 错误。</li><li>成功时 <code>/result</code> 返回可播放、非空的 <code>video/mp4</code>。</li><li>失败时保留错误和环境信息，但不把 Cookie、账号、完整下载 URL 写入日志或知识库。</li></ol>\n<h2>一键应用</h2>\n<h3>当前可用</h3>\n<ul><li><strong>查看实现</strong>：阅读内部项目的 <code>app/main.py</code>、Worker 资产和部署说明。</li><li><strong>团队接入</strong>：由拥有受控环境的成员按本卡 SOP 部署，并在内部画布配置网关地址。</li><li><strong>私域交付</strong>：提供脱敏后的部署包、参数模板和验收清单；由交付方在授权环境协助安装。</li></ul>\n<h3>当前不提供</h3>\n<ul><li>面向公开用户的免配置在线运行。</li><li>公开下载、公开传播或绕过权限获取平台视频。</li><li>将账号 Cookie、浏览器 profile、绝对本地路径、签名下载 URL 打包进 GitHub 或 Skill。</li><li>未经复核的自动重试、账号轮换或多账号并发承诺。</li></ul>\n<h2>常见失败与边界</h2>\n<p>| 现象 | 先检查 | 处理原则 |</p>\n<p>|---|---|---|</p>\n<p>| <code>prompt 不能为空</code> | 请求体 | 传入非空、已授权的分镜提示词。 |</p>\n<p>| <code>任务不存在</code> | <code>task_id</code>、进程重启 | 网关任务状态当前在内存中；服务重启后历史任务不可查询，需避免把它当持久队列。 |</p>\n<p>| 账号激活失败 | 工作室窗口、空闲账号、CDP | 不要盲目重试；先确认工作室和账号状态。 |</p>\n<p>| 长时间 <code>running</code> | Worker、平台生成状态、下载目录 | 等待至 <code>poll_seconds</code>；检查 Worker 输出和下载目录，不依赖单一 UI 文案。 |</p>\n<p>| <code>result</code> 返回 409 | 状态尚未成功 | 继续查 status，不要提前下载。 |</p>\n<p>| <code>result</code> 返回 404 | 下载目录或 Worker 结果 | 确认实际下载文件、读写权限和 Worker 输出。 |</p>\n<p>| 平台页面改版导致自动化失败 | 选择器、工作室版本 | 将问题标记为待验证，更新 Worker 或控制器后重新做真实测试。 |</p>\n<h2>安全、合规与运维边界</h2>\n<ul><li>仅使用已获授权的账号、平台功能和素材；不得将自动化用于绕过账号、权限、额度或平台限制。</li><li>不提交、不记录、不分享 Cookie、账号 profile、密钥、签名 URL、个人下载目录或用户素材。</li><li>当前任务状态保存在进程内存中，服务重启会失去任务查询能力；生产化前需要外置持久化队列和结果存储。</li><li><code>app/main.py</code> 依赖特定本地 Worker、CDP 和下载目录；迁移环境必须参数化路径并重新验收。</li><li>旧的 Playwright 控制器和 README 仍保留设计参考，不等于当前网关默认执行路径；以实际 Worker 链路和版本化测试结果为准。</li></ul>\n<h2>关联卡片</h2>\n<ul><li>念念 AI：画布视频节点与上游资产回库。</li><li>短剧一键生成工作流：将分镜提示词提交到视频生成阶段。</li><li>念念智剪：将生成 MP4 交给后处理、时间线和成片交付。</li></ul>","workflow-short-drama-mvp":"<h1>短剧一键生成工作流（MVP）</h1>\n<ul><li>类型：工作流</li><li>分类：短剧 / AI 视频 / 项目编排</li><li>状态：review（前半段与审核门有代码/测试证据；完整成片交付待真实验证）</li><li>难度：进阶</li><li>分发：公开入门 / 团队标准 / 私域高级交付</li><li>版本：0.1.0</li><li>更新时间：2026-08-21</li><li>维护人：念念团队</li><li>来源：内部项目 <code>E:/codex/niannianai/niannianai</code></li></ul>\n<h2>一句话结论</h2>\n<p>念念 AI 的短剧生产不是“输入一句话立即得到完整成片”，而是将故事或已授权原片拆成可审查、可授权、可恢复的生产阶段：先完成剧本事实与镜头设计，再经用户确认进入候选图和视频生成，最后才进入剪辑交付。</p>\n<h2>先选模式</h2>\n<p>两种路径不能混为同一条“已全自动闭环”的流程。</p>\n<p>| 模式 | 输入 | 当前可确认的结果 | 关键边界 |</p>\n<p>|---|---|---|---|</p>\n<p>| 原创制剧 | 故事梗概、剧本正文或 <code>.docx</code> | 源文本登记、事实账本任务、分集/镜头/提示词审核包、候选图与视频授权门 | 完整真实视频生成与最终成片交付仍待验证 |</p>\n<p>| 源片转绘 | 有权使用的原片 | 原片预检、语义/时间线规划、角色场景资产、Image2/视频候选任务与外部剪辑入口 | 上传到交付的完整真实闭环仍有执行门禁 |</p>\n<h2>解决什么问题</h2>\n<ul><li>将小说、剧本或原片转成可执行的短剧生产项目，而不是在聊天里丢失角色、世界观和分镜关系。</li><li>让编剧、分镜、角色资产、图片、视频、剪辑在同一项目状态机中可审查、可恢复。</li><li>在付费图片/视频生成前设置视觉审核、参考确认、额度/成本和显式提交授权，避免重复扣费与错误生成。</li></ul>\n<h2>适合谁</h2>\n<ul><li><strong>公开用户</strong>：需要理解从故事到短剧的完整生产逻辑、所需输入和审核门。</li><li><strong>团队成员</strong>：需要执行项目创建、N00–N06 状态推进、候选审核、生成验收和故障回读。</li><li><strong>私域高级用户</strong>：已具备素材权利与预算，愿意在受控交付中使用模板、提示词包、候选图审查和人工协同。</li></ul>\n<p>不适合把未授权小说、剧本、原片或他人角色素材直接投入生成的人群。</p>\n<h2>输入 → 处理 → 输出</h2>\n<pre><code>原创制剧输入\n  项目名 + 题材 + 受众 + 60/90 秒 + 9:16/16:9\n  + .docx 或至少 120 字符正文 + 权利确认\n\n处理\n  N00 源文本登记与校验\n  → N01 故事事实账本\n  → N02 分集改编地图\n  → N03 镜头事实卡\n  → N04 分镜提示词审核包\n  → 用户视觉审核与明确授权\n  → N05 Image2 候选图\n  → 参考确认、成本/规格/提交授权\n  → N06 视频生成与成片交付\n\n输出\n  可追溯的文本证据、分集/镜头/提示词包、候选图、视频资产、剪辑交付</code></pre>\n<blockquote>当前已证明 N00、N01 任务准备、N04 审核包、N05/N06 授权门与候选任务合同；不能把上图最后的“视频生成与成片交付”描述为已完成的无人值守闭环。</blockquote>\n<h2>原创制剧 SOP</h2>\n<h3>1. 录入并确认权利</h3>\n<p>创建项目时填写项目名称、题材、受众、单集时长和画幅；提交 <code>.docx</code> 或至少 120 字符的故事/剧本正文，并明确确认拥有使用与改编权限。</p>\n<ul><li>Word 仅接受 <code>.docx</code>，单文件最大 25MB。</li><li>文本会进行长度校验；项目创建不是视频生成提交。</li><li>源文本与抽取结果应被登记为项目证据，不应在公开卡片中暴露原文、路径或哈希。</li></ul>\n<h3>2. 完成 N00 源文本登记</h3>\n<p>系统保存源文本/Word 抽取结果、段落索引和完整性记录，并使项目进入 N01，而不是直接调用图片或视频 Provider。</p>\n<p>验收：项目状态显示源文本已核验，视频 Provider 仍处于阻塞或未授权状态。</p>\n<h3>3. 准备 N01 编剧任务</h3>\n<p>生成 AI 编剧任务包，以故事事实为中心建立人物、关系、世界观和时间线账本。</p>\n<p>N01 的要求：</p>\n<ul><li>基于源文本和段落引用工作。</li><li>不修改源文本事实。</li><li>不直接生成图片或视频。</li><li>产出可回读的任务状态、检查点、产物账本和提示词/任务说明。</li></ul>\n<h3>4. 推进 N02–N04 并做视觉审核</h3>\n<pre><code>N02：分集改编地图\nN03：镜头事实卡\nN04：每集提示词审核包</code></pre>\n<p>N04 就绪后，先让人审核角色、场景、叙事与画面方向。未获得用户视觉接受和显式授权时，不得进入实际图片或视频 Provider 提交。</p>\n<h3>5. N05 候选图与参考确认</h3>\n<p>在明确授权后生成角色、常驻场景、关键道具或真实首帧等候选图。候选图必须等待确认；拒绝或重做必须记录原因。</p>\n<p>此授权只允许受控的候选图流程，不自动等同于视频生成、批量发送、资产注册或公开发布授权。</p>\n<h3>6. N06 视频生成与交付（待真实闭环验证）</h3>\n<p>在规格锁定、参考图确认、额度/成本核验和明确提交授权后，才允许创建视频任务。实际验收必须证明：</p>\n<ol><li>同一提交没有重复扣费或重复提交。</li><li>可查询任务状态。</li><li>成功结果进入项目资产库。</li><li>网站刷新后仍能预览/播放。</li><li>最终成片可被用户交付页读取。</li></ol>\n<p>在上述真实证据补齐前，N06 只能标记为“待验证”，不能对外承诺一键成片。</p>\n<h2>画布编排参考链</h2>\n<p>画布中存在另一条用于原创故事编排的链路：</p>\n<pre><code>screenwriter\n→ chaoge-assets-trial\n→ shotlist-builder\n→ hell-grind\n→ Image2 候选任务\n→ H3 / 豆包 / 其他视频渠道候选任务</code></pre>\n<p>当前该链路的已验证范围是：节点注册、端口连线、输入就绪校验、项目持久化、编排输出和候选任务准备。编排测试不等于真实图片/视频 Provider 已完成生成。</p>\n<h2>源片转绘模式</h2>\n<pre><code>有权原片\n→ 原片预检\n→ Step01 语义分析\n→ Step02 时间线确认\n→ 地区/叙事改编\n→ 角色与场景资产\n→ Image2\n→ H3 / Animate 视频\n→ 智能剪辑\n→ 成片交付</code></pre>\n<p>这条路径适用于“已有原片、希望转绘/重构”的需求。当前应按权威执行计划逐段验收，不能把节点 UI、合同测试、Provider 任务号或 HTTP 200 当作最终视频交付。</p>\n<h2>当前已验证能力</h2>\n<ul><li>文本和 <code>.docx</code> 输入，含权利确认、文本长度和 Word 大小校验。</li><li>源文本抽取、章节/段落索引、项目持久化和完整性记录。</li><li>项目创建后进入 N01，且图像/视频 Provider 默认不提交。</li><li>N01 任务目录、状态、检查点、产物账本与任务说明准备。</li><li>N04 审核包状态回读。</li><li>N05 显式授权、候选图确认/拒绝合同。</li><li>编剧、资产、镜头表、连续性等画布节点的端口校验、持久化与编排输出。</li><li>dry-run、幂等、项目隔离和敏感字段拒绝。</li></ul>\n<h2>当前不承诺</h2>\n<ul><li>文字或 Word 上传后自动完成完整短剧视频。</li><li>已完成真实的 Image2 或视频 Provider 生产提交。</li><li>已完成从脚本到最终 MP4 的无人值守闭环。</li><li>已完成网站内最终成片的播放、刷新恢复和下载交付。</li><li>编排测试或 Provider 任务号等同于最终结果。</li></ul>\n<h2>一键应用</h2>\n<h3>公开层</h3>\n<ul><li>查看两种生产模式、输入清单和审核节点。</li><li>领取故事梗概、人物卡、分镜表等脱敏模板。</li><li>了解“先审核、后付费生成”的生产方法。</li></ul>\n<h3>团队层</h3>\n<ul><li>创建脚本项目与 N00–N06 任务。</li><li>使用项目状态、产物账本、候选审核与恢复动作。</li><li>运行真实环境验收：N01 回读、N05 图像生成、N06 视频生成、资产回库、播放和交付。</li></ul>\n<h3>私域层</h3>\n<ul><li>受控交付项目模板、Prompt 包、角色/分镜审核模板、部署协助和生产陪跑。</li><li>每一次真实图片/视频提交仍必须由拥有素材权利和成本授权的用户确认。</li></ul>\n<h2>验收标准</h2>\n<h3>当前可验收的前半段</h3>\n<ol><li>文本或 <code>.docx</code> 录入后，项目创建成功且输入被核验。</li><li>项目进入 N01，视频 Provider 未被自动提交。</li><li>N01 任务包可回读，包含状态、检查点、产物账本和任务说明。</li><li>N04 可显示为审核就绪，而不是已生成视频。</li><li>N05 未授权时明确阻塞；候选审核有确认/拒绝原因记录。</li></ol>\n<h3>仍需补齐的全链路验收</h3>\n<ol><li>真实 N01 产出事实账本并确认段落引用正确。</li><li>真实 N02/N03/N04 产物与项目状态一致。</li><li>真实 N05 图片生成后回库并可在刷新后查看。</li><li>真实 N06 视频提交仅发生一次，能查询、回库、播放与恢复。</li><li>最终成片可通过产品界面交付给用户。</li></ol>\n<h2>常见失败与边界</h2>\n<p>| 情况 | 原因或风险 | 正确处理 |</p>\n<p>|---|---|---|</p>\n<p>| 文本不足或 Word 无法抽取 | 输入不满足项目创建条件 | 补充正文或更换合格 <code>.docx</code>，不要用虚构文本绕过。 |</p>\n<p>| 项目创建后没有视频 | 正常：当前首先进入 N01，不会自动提交 Provider | 查看项目状态和任务包，继续完成事实/分镜审核。 |</p>\n<p>| N05 被阻塞 | 没有视觉接受或明确图片授权 | 先审 N04，再给出范围明确的授权。 |</p>\n<p>| N06 被阻塞 | 规格、参考、额度或提交授权未完成 | 补齐门禁后再创建唯一提交。 |</p>\n<p>| 页面有节点但无结果 | UI/合同不等于实际交付 | 检查真实 Provider 查询、资产回库、播放和刷新恢复。 |</p>\n<p>| 同任务重复提交 | 网络或状态不确定 | 保留幂等键，先查询既有任务，进入 <code>review/uncertain</code>，不盲目重发。 |</p>\n<h2>安全与合规边界</h2>\n<ul><li>仅处理拥有使用、改编、生成和分发权利的文本、原片、角色与素材。</li><li>不在公开卡、GitHub、Skill 或日志中存放用户剧本、原片、项目 ID、内部路径、哈希、任务 ID、Provider 原始响应、密钥、Cookie、token 或签名 URL。</li><li>生成费用必须在真实提交前由具备权限的人确认；dry-run 不得被包装为真实生成。</li><li>将“审核中、等待授权、生成中、失败、已交付”明确展示给用户，避免把剧本摄取或候选任务误导为最终视频。</li></ul>\n<h2>关联卡片</h2>\n<ul><li>念念 AI：画布、模型通道、项目资产与运行时。</li><li>豆包视频 FastAPI + Playwright 自动化服务：可作为受控视频生成后端之一。</li><li>念念智剪：将视频片段送入时间线、智能剪辑与成片交付。</li></ul>"};
const typeLabels = {tool:'工具',workflow:'工作流',project:'项目',automation:'自动化',method:'方法',retrospective:'复盘',insight:'信息差'};
const audienceLabels = {public:'公开',team:'团队',private:'私域'};
const statusLabels = {draft:'草稿',review:'待验证',verified:'已验证',recommended:'推荐',stale:'待更新',deprecated:'已废弃',reference:'仅供参考'};
const cardsNode = document.querySelector('#cards');
const resultText = document.querySelector('#resultText');
const searchNode = document.querySelector('#search');
const typeNode = document.querySelector('#type');
const audienceNode = document.querySelector('#audience');
const statusNode = document.querySelector('#status');
const dialog = document.querySelector('#detailDialog');
const detailContent = document.querySelector('#detailContent');
let items = DATA;
function escapeHtml(value=''){return String(value).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function matches(item){
  const term=searchNode.value.trim().toLowerCase();
  const hay=[item.title,item.summary,item.category,...item.tags].join(' ').toLowerCase();
  return (!term||hay.includes(term))&&(!typeNode.value||item.type===typeNode.value)&&(!audienceNode.value||item.audience.includes(audienceNode.value))&&(!statusNode.value||item.status===statusNode.value);
}
function cardHtml(item){
  const audience=item.audience.map(v=>'<span class="pill">'+audienceLabels[v]+'</span>').join('');
  const visual=item.visual&&item.visual.cover?'<div class="card-cover"><img src="'+escapeHtml(item.visual.cover)+'" alt="'+escapeHtml(item.title)+'视觉封面" loading="lazy"></div>':'';
  return '<article class="card">'+visual+'<div class="card-body"><div class="card-top"><span class="pill status-'+escapeHtml(item.status)+'">'+statusLabels[item.status]+'</span><span class="pill">复利 '+item.score+'/5</span></div><h3>'+escapeHtml(item.title)+'</h3><p>'+escapeHtml(item.summary)+'</p><div class="card-meta"><span>'+typeLabels[item.type]+'</span><span>·</span><span>'+(item.difficulty==='beginner'?'入门':item.difficulty==='intermediate'?'进阶':'高级')+'</span>'+audience+'</div><div class="card-actions"><button class="button primary" data-detail="'+escapeHtml(item.id)+'">查看详情</button></div></div></article>';
}
function render(){
  const filtered=items.filter(matches);
  resultText.textContent='显示 '+filtered.length+' / '+items.length+' 张卡片';
  cardsNode.innerHTML=filtered.length?filtered.map(cardHtml).join(''):'<div class="empty">没有匹配的知识卡。试试换个关键词或清除筛选。</div>';
}
function openDetail(id){
  const item=items.find(c=>c.id===id);
  if(!item)return;
  const source=item.source&&item.source.url?'<p><strong>原始来源：</strong><a href="'+escapeHtml(item.source.url)+'" target="_blank" rel="noreferrer">打开来源</a></p>':'<p><strong>原始来源：</strong>内部资产</p>';
  const actions=(item.actions&&item.actions.length)?'<h3>可用动作</h3><p>'+item.actions.map(a=>'<a class="button'+(a.kind==='detail'?' primary':'')+'" href="'+(a.target||item.source.url||'#')+'" target="_blank" rel="noreferrer">'+(a.label||'查看')+'</a>').join(' ')+'</p>':'';
  const visual=item.visual?'<h3>视觉卡组</h3><div class="visual-gallery"><img class="visual-cover" src="'+escapeHtml(item.visual.cover)+'" alt="'+escapeHtml(item.title)+'封面"><div class="visual-pages">'+item.visual.pages.map((page,index)=>'<a href="'+escapeHtml(page)+'" target="_blank" rel="noreferrer"><img src="'+escapeHtml(page)+'" alt="'+escapeHtml(item.title)+'第'+(index+1)+'张内页" loading="lazy"></a>').join('')+'</div><p class="detail-meta">视觉档案：'+escapeHtml(item.visual.profile)+' · 点击图片可查看大图。</p></div>':'';
  detailContent.innerHTML='<span class="pill status-'+escapeHtml(item.status)+'">'+statusLabels[item.status]+'</span><h2>'+escapeHtml(item.title)+'</h2><p>'+escapeHtml(item.summary)+'</p><p class="detail-meta">'+typeLabels[item.type]+' · '+item.tags.map(escapeHtml).join(' / ')+' · 更新于 '+item.updatedAt+' · 维护人：'+escapeHtml(item.owner)+'</p>'+visual+source+actions+'<hr>'+DETAILS[id];
  dialog.showModal();
}
document.querySelector('#cardCount').textContent=items.length;
[...new Set(items.map(i=>i.type))].sort().forEach(t=>typeNode.insertAdjacentHTML('beforeend','<option value="'+t+'">'+typeLabels[t]+'</option>'));
[searchNode,typeNode,audienceNode,statusNode].forEach(n=>n.addEventListener('input',render));
document.querySelectorAll('[data-query]').forEach(b=>b.addEventListener('click',()=>{searchNode.value=b.dataset.query;render();document.querySelector('.knowledge-section').scrollIntoView({behavior:'smooth'});}));
cardsNode.addEventListener('click',e=>{const b=e.target.closest('[data-detail]');if(b)openDetail(b.dataset.detail);});
dialog.querySelector('.close').addEventListener('click',()=>dialog.close());
render();
</script>
</body>
</html>
